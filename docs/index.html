<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c7271a'/%3E%3Cpath d='M20 14h24v36H20z' fill='white'/%3E%3C/svg%3E">
  <title>通知中枢</title>
  <style>
    :root {
      --ink: #18212f;
      --muted: #667085;
      --paper: #f5f7fa;
      --panel: #ffffff;
      --line: #d8dee8;
      --signal: #c7271a;
      --signal-soft: #fff0ed;
      --amber: #b26a00;
      --amber-soft: #fff7e6;
      --green: #147d64;
      --green-soft: #eaf8f4;
      --blue: #2459a9;
      --shadow: 0 16px 44px rgba(33, 44, 61, .09);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(36, 89, 169, .28); outline-offset: 2px; }
    .shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; border: 0; padding: 0; color: inherit; background: transparent; text-align: left; cursor: pointer; }
    .brand:hover strong { color: var(--signal); }
    .beacon { width: 14px; height: 38px; background: var(--signal); border-radius: 3px; box-shadow: 8px 0 0 #f2b3aa; }
    .brand strong { display: block; font: 800 25px/1 "Arial Narrow", "Microsoft YaHei", sans-serif; letter-spacing: -.04em; }
    .brand small { color: var(--muted); font: 11px/1.4 Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .clock { color: var(--muted); font: 12px Consolas, monospace; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 25px 28px 20px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 7px; color: var(--muted); font: 700 11px Consolas, monospace; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font: 800 clamp(28px, 6vw, 45px)/1.08 "Arial Narrow", "Microsoft YaHei", sans-serif; letter-spacing: -.045em; }
    .notice-body { margin: 14px 0 0; color: #3f4b5d; white-space: pre-wrap; font-size: 16px; }
    .status-strip { display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center; padding: 18px 28px; background: #fbfcfe; border-bottom: 1px solid var(--line); }
    .status-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 6px var(--signal-soft); flex: none; }
    .status-dot.open { animation: pulse 1.6s ease-in-out infinite; }
    .status-dot.confirmed { background: var(--green); box-shadow: 0 0 0 6px var(--green-soft); }
    .status-dot.lost { background: var(--muted); box-shadow: 0 0 0 6px #edf0f4; }
    .status-copy strong { display: block; }
    .status-copy span { display: block; color: var(--muted); font-size: 13px; }
    .countdown { text-align: right; }
    .countdown strong { display: block; font: 800 25px/1 Consolas, monospace; }
    .countdown span { color: var(--muted); font-size: 12px; }
    .timeline { padding: 24px 28px; }
    .timeline-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 17px; }
    .timeline-title strong { font-size: 14px; }
    .timeline-title span { color: var(--muted); font-size: 12px; }
    .rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .rail-item { min-height: 80px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; }
    .rail-item.sent { border-color: #acd8cb; background: var(--green-soft); }
    .rail-item.pending { border-color: #edc178; background: var(--amber-soft); }
    .rail-item.failed { border-color: #efb3ab; background: var(--signal-soft); }
    .rail-item b { display: block; font-size: 13px; }
    .rail-item small { color: var(--muted); }
    .action-zone { padding: 0 28px 28px; }
    .confirm-button { width: 100%; border: 0; border-radius: 13px; padding: 16px 20px; color: white; background: var(--signal); font-weight: 800; cursor: pointer; box-shadow: 0 9px 22px rgba(199, 39, 26, .23); transition: transform .16s ease, box-shadow .16s ease; }
    .confirm-button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(199, 39, 26, .29); }
    .confirm-button:disabled { cursor: wait; opacity: .62; transform: none; }
    .helper { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: 12px; }
    .login { max-width: 430px; margin: 9vh auto 0; padding: 30px; }
    .login h1 { margin-bottom: 8px; }
    .login p { color: var(--muted); margin: 0 0 24px; }
    .field { display: flex; gap: 9px; }
    .field input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 13px 14px; background: #fff; }
    .field button, .subtle-button { border: 0; border-radius: 11px; padding: 12px 18px; color: white; background: var(--ink); cursor: pointer; font-weight: 700; }
    .error { color: var(--signal); margin-top: 12px; font-size: 13px; }
    .sync-error { margin: 0 0 12px; padding: 10px 13px; color: var(--amber); background: var(--amber-soft); border: 1px solid #edc178; border-radius: 10px; font-size: 13px; }
    .history-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 18px; }
    .history-head h1 { font-size: 34px; }
    .history-tools { display: flex; align-items: center; gap: 8px; }
    .filter-summary { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .filter-clear { border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; background: #fff; color: var(--ink); cursor: pointer; font-weight: 700; }
    .history-list { display: grid; gap: 11px; }
    .time-group { border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.62); overflow: hidden; }
    .time-group summary { display: flex; justify-content: space-between; padding: 14px 18px; cursor: pointer; font-weight: 800; list-style: none; }
    .time-group summary::-webkit-details-marker { display: none; }
    .time-group summary::after { content: '＋'; color: var(--muted); }
    .time-group[open] summary::after { content: '−'; }
    .time-group-list { display: grid; gap: 10px; padding: 0 10px 10px; }
    .history-item { padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    .history-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .history-item h2 { margin: 3px 0 7px; font-size: 18px; line-height: 1.3; }
    .history-item p { margin: 0; color: var(--muted); }
    .history-actions { display: flex; gap: 8px; margin-top: 14px; }
    .history-action { border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; background: #fff; color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 700; }
    .history-action.confirm { color: var(--green); border-color: #acd8cb; background: var(--green-soft); }
    .history-action.delete { color: var(--signal); border-color: #efb3ab; background: var(--signal-soft); }
    .history-action.restore { color: var(--green); border-color: #acd8cb; background: var(--green-soft); }
    .history-action:disabled { opacity: .5; cursor: wait; }
    .history-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 12px; }
    .filter-tag { border: 0; border-radius: 999px; padding: 5px 10px; color: var(--blue); background: #edf4ff; cursor: pointer; font-size: 12px; font-weight: 750; }
    .filter-tag.time { color: var(--amber); background: var(--amber-soft); }
    .device-tag { border-radius: 999px; padding: 5px 10px; color: var(--green); background: var(--green-soft); font-size: 12px; font-weight: 750; }
    .bug-fix { margin-top: 14px; padding: 14px; border: 1px solid #c9d7ef; border-radius: 11px; background: #f5f8ff; }
    .bug-fix strong { display: block; margin-bottom: 7px; }
    .bug-fix p { color: var(--ink); white-space: pre-wrap; }
    .bug-files { margin: 9px 0 0; color: var(--muted); font: 11px Consolas, monospace; }
    .bug-result { margin-top: 9px; color: var(--muted); font-size: 12px; white-space: pre-wrap; }
    .bug-link { color: var(--blue); font-weight: 750; }
    .history-action.approve { color: #fff; border-color: var(--blue); background: var(--blue); }
    .history-action.rollback { color: var(--amber); border-color: #e3c985; background: var(--amber-soft); }
    .filter-tag:hover { box-shadow: inset 0 0 0 1px currentColor; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 800; white-space: nowrap; background: #edf0f4; }
    .badge.level-1 { color: var(--signal); background: var(--signal-soft); }
    .badge.level-2 { color: var(--amber); background: var(--amber-soft); }
    .badge.level-3 { color: var(--blue); background: #edf4ff; }
    .meta { color: var(--muted); font: 11px Consolas, monospace; }
    .empty { padding: 60px 24px; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }
    .call-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(15,23,36,.72); backdrop-filter: blur(8px); }
    .call-card { width: min(420px, 100%); padding: 34px 28px; color: #fff; text-align: center; background: #18212f; border: 1px solid rgba(255,255,255,.2); border-radius: 24px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .call-pulse { width: 76px; height: 76px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; background: var(--signal); font-size: 34px; animation: callPulse 1.2s ease-in-out infinite; }
    .call-card h2 { margin: 6px 0; font-size: 26px; }
    .call-card p { margin: 0 0 24px; color: #cfd6e2; }
    .hangup { width: 72px; height: 72px; border: 0; border-radius: 50%; color: #fff; background: var(--signal); cursor: pointer; font-size: 26px; transform: rotate(135deg); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(199,39,26,.08); } }
    @keyframes callPulse { 50% { transform: scale(1.07); box-shadow: 0 0 0 18px rgba(199,39,26,.18); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (max-width: 620px) {
      .shell { width: min(100% - 20px, 920px); padding-top: 18px; }
      .clock { display: none; }
      .panel-head, .timeline, .action-zone { padding-left: 19px; padding-right: 19px; }
      .status-strip { grid-template-columns: 1fr; padding: 17px 19px; }
      .countdown { text-align: left; margin-left: 23px; }
      .rail { grid-template-columns: 1fr; }
      .history-head { align-items: start; }
      .history-head { flex-wrap: wrap; }
      .history-item { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <button class="brand" id="allNotifications" type="button" aria-label="查看全部通知"><span class="beacon" aria-hidden="true"></span><span><strong>通知中枢</strong><small>点击查看全部通知</small></span></button>
      <time class="clock" id="clock"></time>
    </header>

    <section id="loading" class="panel empty">正在读取通知状态…</section>

    <section id="notice" class="panel hidden" aria-live="polite">
      <div class="panel-head">
        <p class="eyebrow" id="noticeLevel"></p>
        <h1 id="noticeTitle"></h1>
        <p class="notice-body" id="noticeBody"></p>
      </div>
      <div class="status-strip">
        <div class="status-main"><span class="status-dot" id="statusDot"></span><div class="status-copy"><strong id="statusName"></strong><span id="statusDetail"></span></div></div>
        <div class="countdown"><strong id="countdown">--:--</strong><span>确认窗口剩余</span></div>
      </div>
      <div class="timeline">
        <div class="timeline-title"><strong>通知路径</strong><span id="nextReminder"></span></div>
        <div class="rail" id="rail"></div>
      </div>
      <div class="action-zone" id="actionZone">
        <button class="confirm-button" id="confirmButton">确认收到，停止提醒</button>
        <p class="helper">打开页面不会自动确认，只有点击按钮才会停止后续通知。</p>
      </div>
    </section>

    <section id="login" class="panel login hidden">
      <p class="eyebrow">Protected history</p>
      <h1>通知记录</h1>
      <p>输入管理口令查看全部发送与确认状态。</p>
      <form class="field" id="loginForm"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="管理口令" aria-label="管理口令"><button>进入</button></form>
      <div class="error" id="loginError"></div>
    </section>

    <section id="history" class="hidden">
      <div class="history-head"><div><p class="eyebrow">Delivery archive</p><h1 id="historyTitle">通知记录</h1><p class="filter-summary hidden" id="filterSummary"></p></div><div class="history-tools"><button class="filter-clear hidden" id="clearFilter">查看全部</button><button class="filter-clear" id="alertToggle" aria-pressed="true">提示：开</button><button class="filter-clear" id="trashButton">回收站</button><button class="subtle-button" id="logout">退出</button></div></div>
      <div class="sync-error hidden" id="syncError">网络暂时异常，正在自动重试；登录状态已保留。</div>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <div class="call-overlay hidden" id="callOverlay" role="dialog" aria-modal="true" aria-labelledby="callTitle">
    <div class="call-card"><div class="call-pulse">🔴</div><p class="eyebrow">紧急语音提醒</p><h2 id="callTitle"></h2><p id="callSource"></p><button class="hangup" id="hangup" type="button" aria-label="挂断">☎</button></div>
  </div>

  <script>
    const API = location.hostname === 'localhost' || location.hostname.startsWith('127.') || location.hostname === '::1' || location.hostname === '[::1]' ? 'http://127.0.0.1:3219' : 'https://liangzai666.com/notify/api';
    const query = new URLSearchParams(location.search);
    const confirmationToken = query.get('token');
    let currentEvent = null;
    let countdownTimer = null;
    let allEvents = [];
    let activeFilter = null;
    let viewingTrash = false;
    let knownEventIds = null;
    let audioContext = null;
    let audioReady = false;
    let callMusicTimer = null;
    let callEventId = null;
    let realtimeController = null;
    let realtimeRetryTimer = null;
    let realtimeBackoff = 1000;
    let alertEnabled = localStorage.getItem('notificationHubAlerts') !== 'off';
    const $ = (id) => document.getElementById(id);
    const labels = { open: '等待确认', confirmed: '已确认收到', lost: '通知遗失', informational: '无需确认' };
    const channelLabels = { wecom: '企业微信', email: '邮件', serverchan: 'Server酱' };
    const statusLabels = { sent: '已发送', pending: '待发送', sending: '发送中', failed: '发送失败', cancelled: '已停止' };

    function show(id) { ['loading','notice','login','history'].forEach((name) => $(name).classList.toggle('hidden', name !== id)); }
    function formatTime(value) { return value ? new Intl.DateTimeFormat('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).format(new Date(value)) : '—'; }
    function timeCategory(value) {
      const date = new Date(value); const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const eventDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const days = Math.round((start - eventDay) / 86400000);
      return days <= 0 ? '今天' : days === 1 ? '昨天' : days === 2 ? '两天前' : days <= 7 ? '近一周' : '更早';
    }
    function updateClock() { $('clock').textContent = new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).format(new Date()); }
    setInterval(updateClock, 1000); updateClock();

    function unlockAudio() {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      const resumed = audioContext.state === 'suspended' ? audioContext.resume() : Promise.resolve();
      resumed.then(() => { audioReady = audioContext.state === 'running'; renderAlertToggle(); }).catch(() => {});
    }
    document.addEventListener('pointerdown', unlockAudio, { passive:true });

    function tone(frequency, duration = .18, volume = .08, delay = 0) {
      unlockAudio();
      const start = audioContext.currentTime + delay;
      const oscillator = audioContext.createOscillator(); const gain = audioContext.createGain();
      oscillator.frequency.value = frequency; oscillator.type = 'sine'; gain.gain.setValueAtTime(volume, start); gain.gain.exponentialRampToValueAtTime(.001, start + duration);
      oscillator.connect(gain).connect(audioContext.destination); oscillator.start(start); oscillator.stop(start + duration);
    }
    function playLevelTwoSound() { tone(740, .16); tone(980, .2, .07, .18); }
    function stopCall() {
      clearInterval(callMusicTimer); callMusicTimer = null; callEventId = null;
      window.speechSynthesis?.cancel(); $('callOverlay').classList.add('hidden');
    }
    function startCall(event) {
      stopCall(); callEventId = event.id; $('callTitle').textContent = event.title; $('callSource').textContent = `来自 ${event.source}`; $('callOverlay').classList.remove('hidden');
      const music = () => { tone(440, .28, .055); tone(554, .28, .045, .32); tone(659, .35, .045, .64); };
      music(); callMusicTimer = setInterval(music, 1800);
      if ('speechSynthesis' in window) { const voice = new SpeechSynthesisUtterance(`紧急通知，来自${event.source}。${event.title}`); voice.lang = 'zh-CN'; voice.rate = .9; window.speechSynthesis.resume?.(); window.speechSynthesis.speak(voice); }
    }
    $('hangup').addEventListener('click', stopCall);
    function renderAlertToggle() { $('alertToggle').textContent = `提示：${alertEnabled ? '开' : '关'}${alertEnabled && !audioReady ? ' · 点此启用声音' : ''}`; $('alertToggle').setAttribute('aria-pressed', String(alertEnabled)); }
    $('alertToggle').addEventListener('click', () => { alertEnabled = !alertEnabled; localStorage.setItem('notificationHubAlerts', alertEnabled ? 'on' : 'off'); if (!alertEnabled) stopCall(); else unlockAudio(); renderAlertToggle(); });
    renderAlertToggle();

    async function api(path, options = {}) {
      const response = await fetch(API + path, { ...options, headers: { 'content-type':'application/json', ...options.headers } });
      const data = await response.json().catch(() => ({ error:{ code:'INVALID_RESPONSE' } }));
      if (!response.ok) throw Object.assign(new Error(data.error?.code || 'REQUEST_FAILED'), { status: response.status, data });
      return data;
    }

    function renderNotice(event) {
      currentEvent = event;
      show('notice');
      $('noticeLevel').textContent = `LEVEL ${event.level} · ${event.source}`;
      $('noticeTitle').textContent = event.title;
      $('noticeBody').textContent = event.body;
      $('statusName').textContent = labels[event.status] || event.status;
      $('statusDot').className = `status-dot ${event.status}`;
      $('statusDetail').textContent = event.status === 'open' ? `创建于 ${formatTime(event.createdAt)}` : event.status === 'confirmed' ? `确认于 ${formatTime(event.confirmedAt)}` : `截止于 ${formatTime(event.expiresAt)}`;
      $('nextReminder').textContent = event.status === 'open' && event.nextReminderAt ? `下次 ${formatTime(event.nextReminderAt)}` : '提醒已停止';
      $('actionZone').classList.toggle('hidden', event.status !== 'open');
      $('rail').innerHTML = summarizeDeliveries(event.deliveries || []).map((item) => `<div class="rail-item ${item.state}"><b>${channelLabels[item.channel]}</b><small>${statusLabels[item.state] || item.state}${item.sentAt ? ` · ${formatTime(item.sentAt)}` : ''}</small></div>`).join('');
      clearInterval(countdownTimer);
      const update = () => {
        if (event.status !== 'open') { $('countdown').textContent = '--:--'; return; }
        const left = Math.max(0, Date.parse(event.expiresAt) - Date.now());
        const minutes = Math.floor(left / 60000); const seconds = Math.floor((left % 60000) / 1000);
        $('countdown').textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
      };
      update(); countdownTimer = setInterval(update, 1000);
    }

    function summarizeDeliveries(deliveries) {
      return ['wecom','email','serverchan'].map((channel) => {
        const rows = deliveries.filter((item) => item.channel === channel);
        const sent = rows.filter((item) => item.status === 'sent').at(-1);
        const failed = rows.find((item) => item.status === 'failed');
        const pending = rows.find((item) => item.status === 'pending' || item.status === 'sending');
        return { channel, state: sent ? 'sent' : failed && !pending ? 'failed' : pending ? 'pending' : 'cancelled', sentAt: sent?.sentAt };
      });
    }

    async function loadConfirmation() {
      try { const data = await api(`/v1/public/event?token=${encodeURIComponent(confirmationToken)}`); renderNotice(data.event); }
      catch (error) { $('loading').textContent = error.status === 401 || error.status === 410 ? '确认链接已失效。' : '通知状态读取失败，请稍后重试。'; }
    }

    $('confirmButton').addEventListener('click', async () => {
      const button = $('confirmButton'); button.disabled = true; button.textContent = '正在确认…';
      try { const data = await api('/v1/public/confirm', { method:'POST', body:JSON.stringify({ token:confirmationToken }) }); renderNotice({ ...data.event, deliveries: currentEvent.deliveries }); }
      catch (error) { button.disabled = false; button.textContent = error.status === 410 ? '确认窗口已结束' : '确认失败，点击重试'; }
    });

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault(); $('loginError').textContent = '';
      try { const data = await api('/v1/session', { method:'POST', body:JSON.stringify({ pin:$('pin').value }) }); localStorage.setItem('notificationHubSession', data.token); await loadHistory(); }
      catch (error) { $('loginError').textContent = error.status === 429 ? '尝试次数过多，请15分钟后再试。' : error.status === 401 ? '口令不正确。' : '网络或服务暂时异常，请稍后重试。'; }
    });

    function eventCard(event, trash = false) {
      const bug = event.bugFix;
      const bugLabels = { pending_approval:'等待审批', approved:'已批准，等待原电脑上线', running:'正在自动修复', succeeded:'修复成功', failed:'修复失败', timed_out:'执行超时', expired:'审批已过期', rollback_requested:'等待原电脑回滚', rolled_back:'已回滚', rollback_failed:'回滚失败' };
      const bugPanel = bug ? `<div class="bug-fix"><strong>Bug修复申请 · ${bugLabels[bug.status] || bug.status}</strong><p>${escapeHtml(bug.plan)}</p><div class="bug-files">影响文件：${bug.impactFiles.length ? bug.impactFiles.map(escapeHtml).join('、') : '由执行任务确认'}</div>${bug.resultSummary ? `<div class="bug-result">${escapeHtml(bug.resultSummary)}</div>` : ''}${bug.taskUrl ? `<a class="bug-link" href="${escapeHtml(bug.taskUrl)}">查看Codex任务</a>` : ''}${bug.prUrl ? ` · <a class="bug-link" href="${escapeHtml(bug.prUrl)}" target="_blank" rel="noopener">查看PR</a>` : ''}</div>` : '';
      const actions = trash ? '<button class="history-action restore" data-action="restore">恢复</button><button class="history-action delete" data-action="purge">彻底删除</button>' : `${bug?.status === 'pending_approval' ? '<button class="history-action approve" data-action="bug-approve">同意自动修复</button>' : ''}${bug?.status === 'succeeded' && bug.backupPath ? '<button class="history-action rollback" data-action="bug-rollback" data-job-id="'+escapeHtml(bug.id)+'">一键回滚</button>' : ''}${event.status === 'open' ? '<button class="history-action confirm" data-action="confirm">确认并停止提醒</button>' : ''}<button class="history-action delete" data-action="delete">删除</button>`;
      return `<article class="history-item" data-event-id="${escapeHtml(event.id)}"><div class="history-top"><span class="badge level-${event.level}">LEVEL ${event.level}</span><span class="meta">${formatTime(event.createdAt)}</span></div><h2>${escapeHtml(event.title)}</h2><p>${escapeHtml(event.body)}</p><div class="history-tags"><button class="filter-tag" data-filter="source" data-value="${encodeURIComponent(event.source)}">${escapeHtml(event.source)}</button><span class="device-tag">发送设备：${escapeHtml(event.device || '未知设备')}</span><button class="filter-tag time" data-filter="time" data-value="${timeCategory(event.createdAt)}">${timeCategory(event.createdAt)}</button><span class="meta">${escapeHtml(event.eventKey)}</span></div>${bugPanel}<div class="history-top" style="margin-top:12px"><span>${trash ? `删除于 ${formatTime(event.deletedAt)}` : ''}</span><strong>${labels[event.status] || event.status}</strong></div><div class="history-actions">${actions}</div></article>`;
    }

    function renderHistory() {
      const events = (activeFilter ? allEvents.filter((event) => activeFilter.type === 'source' ? event.source === activeFilter.value : timeCategory(event.createdAt) === activeFilter.value) : allEvents).slice().sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
      $('historyTitle').textContent = viewingTrash ? '回收站' : activeFilter ? activeFilter.value : '通知记录';
      $('filterSummary').textContent = activeFilter ? `${activeFilter.type === 'source' ? '来源' : '时间'}分类 · ${events.length} 条通知` : '';
      $('filterSummary').classList.toggle('hidden', !activeFilter);
      $('clearFilter').classList.toggle('hidden', !activeFilter);
      if (!events.length) { $('historyList').innerHTML = `<div class="panel empty">${viewingTrash ? '回收站为空。' : '这个分类还没有通知。'}</div>`; return; }
      if (viewingTrash || activeFilter?.type !== 'source') { $('historyList').innerHTML = events.map((event) => eventCard(event, viewingTrash)).join(''); return; }
      const groups = events.reduce((map, event) => map.set(timeCategory(event.createdAt), [...(map.get(timeCategory(event.createdAt)) || []), event]), new Map());
      $('historyList').innerHTML = [...groups].map(([name, rows], index) => `<details class="time-group" ${index === 0 ? 'open' : ''}><summary><span>${name}</span><small>${rows.length} 条</small></summary><div class="time-group-list">${rows.map(eventCard).join('')}</div></details>`).join('');
    }

    async function loadHistory(resetFilter = false, poll = false) {
      const token = localStorage.getItem('notificationHubSession');
      if (!token) { show('login'); return; }
      try {
        const data = await api(`${viewingTrash ? '/v1/trash' : '/v1/events'}?limit=1000`, { headers:{ authorization:`Bearer ${token}` } });
        if (!viewingTrash) {
          const nextIds = new Set(data.events.map((event) => event.id));
          if (knownEventIds && poll && alertEnabled) data.events.filter((event) => !knownEventIds.has(event.id) && event.status === 'open').reverse().forEach((event) => event.level === 1 ? startCall(event) : event.level === 2 ? playLevelTwoSound() : null);
          if (knownEventIds) nextIds.forEach((id) => knownEventIds.add(id)); else knownEventIds = nextIds;
        }
        allEvents = data.events;
        $('syncError').classList.add('hidden');
        if (resetFilter) activeFilter = null;
        show('history');
        renderHistory();
      } catch (error) {
        if (error.status === 401) { localStorage.removeItem('notificationHubSession'); show('login'); return; }
        show('history'); $('syncError').classList.remove('hidden');
      }
    }

    function stopRealtime() {
      clearTimeout(realtimeRetryTimer); realtimeRetryTimer = null;
      realtimeController?.abort(); realtimeController = null;
    }
    function scheduleRealtimeRetry() {
      if (viewingTrash || !localStorage.getItem('notificationHubSession') || realtimeRetryTimer) return;
      realtimeRetryTimer = setTimeout(() => { realtimeRetryTimer = null; connectRealtime(); }, realtimeBackoff);
      realtimeBackoff = Math.min(realtimeBackoff * 2, 30000);
    }
    async function connectRealtime() {
      if (viewingTrash || realtimeController) return;
      const token = localStorage.getItem('notificationHubSession');
      if (!token) return;
      const controller = new AbortController(); realtimeController = controller;
      try {
        const response = await fetch(`${API}/v1/stream`, { headers: { accept:'text/event-stream', authorization:`Bearer ${token}` }, cache:'no-store', signal:controller.signal });
        if (!response.ok) throw Object.assign(new Error('STREAM_FAILED'), { status: response.status });
        realtimeBackoff = 1000; $('syncError').classList.add('hidden');
        const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
        while (!controller.signal.aborted) {
          const chunk = await reader.read(); if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream:true });
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) >= 0) {
            const message = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);
            if (message.split('\n').includes('event: refresh')) await loadHistory(false, true);
          }
        }
      } catch (error) {
        if (controller.signal.aborted) return;
        if (error.status === 401) { localStorage.removeItem('notificationHubSession'); stopRealtime(); show('login'); return; }
        $('syncError').classList.remove('hidden');
      } finally {
        if (realtimeController === controller) realtimeController = null;
        if (!controller.signal.aborted) scheduleRealtimeRetry();
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !$('history').classList.contains('hidden') && !viewingTrash) {
        loadHistory(false, true); stopRealtime(); realtimeBackoff = 1000; connectRealtime();
      }
    });

    $('allNotifications').addEventListener('click', () => { viewingTrash = false; loadHistory(true); connectRealtime(); });
    $('trashButton').addEventListener('click', () => { viewingTrash = !viewingTrash; activeFilter = null; $('trashButton').textContent = viewingTrash ? '返回通知' : '回收站'; if (viewingTrash) stopRealtime(); loadHistory(true); if (!viewingTrash) connectRealtime(); });
    $('clearFilter').addEventListener('click', () => { activeFilter = null; renderHistory(); });
    $('historyList').addEventListener('click', async (click) => {
      const tag = click.target.closest('[data-filter]');
      if (tag) { activeFilter = { type: tag.dataset.filter, value: tag.dataset.filter === 'source' ? decodeURIComponent(tag.dataset.value) : tag.dataset.value }; renderHistory(); return; }
      const button = click.target.closest('[data-action]');
      if (!button) return;
      const item = button.closest('[data-event-id]');
      const token = localStorage.getItem('notificationHubSession');
      if (!item || !token) { show('login'); return; }
      button.disabled = true;
      try {
        const action = button.dataset.action;
        const eventId = encodeURIComponent(item.dataset.eventId);
        const path = action === 'bug-approve' ? `/v1/events/${eventId}/bug-fix/approve` : action === 'bug-rollback' ? `/v1/bug-fixes/${encodeURIComponent(button.dataset.jobId)}/rollback` : action === 'restore' ? `/v1/trash/${eventId}/restore` : action === 'purge' ? `/v1/trash/${eventId}` : `/v1/events/${eventId}${action === 'confirm' ? '/confirm' : ''}`;
        await api(path, { method: ['confirm','bug-approve','bug-rollback','restore'].includes(action) ? 'POST' : 'DELETE', headers:{ authorization:`Bearer ${token}` } });
        if (callEventId === item.dataset.eventId) stopCall();
        await loadHistory();
      } catch (error) {
        button.disabled = false;
        button.textContent = error.status === 401 ? '请重新登录' : '操作失败，重试';
      }
    });

    $('logout').addEventListener('click', () => { stopRealtime(); localStorage.removeItem('notificationHubSession'); show('login'); });
    function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
    if (confirmationToken) loadConfirmation(); else loadHistory().then(connectRealtime);
  </script>
</body>
</html>
