<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c7271a'/%3E%3Cpath d='M20 14h24v36H20z' fill='white'/%3E%3C/svg%3E">
  <title>通知中枢</title>
  <style>
    :root {
      --ink: #18212f;
      --muted: #667085;
      --paper: #f5f7fa;
      --panel: #ffffff;
      --line: #d8dee8;
      --signal: #c7271a;
      --signal-soft: #fff0ed;
      --amber: #b26a00;
      --amber-soft: #fff7e6;
      --green: #147d64;
      --green-soft: #eaf8f4;
      --blue: #2459a9;
      --shadow: 0 16px 44px rgba(33, 44, 61, .09);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(36, 89, 169, .28); outline-offset: 2px; }
    .shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; border: 0; padding: 0; color: inherit; background: transparent; text-align: left; cursor: pointer; }
    .brand:hover strong { color: var(--signal); }
    .beacon { width: 14px; height: 38px; background: var(--signal); border-radius: 3px; box-shadow: 8px 0 0 #f2b3aa; }
    .brand strong { display: block; font: 800 25px/1 "Arial Narrow", "Microsoft YaHei", sans-serif; letter-spacing: -.04em; }
    .brand small { color: var(--muted); font: 11px/1.4 Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .clock { color: var(--muted); font: 12px Consolas, monospace; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 25px 28px 20px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 7px; color: var(--muted); font: 700 11px Consolas, monospace; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font: 800 clamp(28px, 6vw, 45px)/1.08 "Arial Narrow", "Microsoft YaHei", sans-serif; letter-spacing: -.045em; }
    .notice-body { margin: 14px 0 0; color: #3f4b5d; white-space: pre-wrap; font-size: 16px; }
    .status-strip { display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center; padding: 18px 28px; background: #fbfcfe; border-bottom: 1px solid var(--line); }
    .status-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 6px var(--signal-soft); flex: none; }
    .status-dot.open { animation: pulse 1.6s ease-in-out infinite; }
    .status-dot.confirmed { background: var(--green); box-shadow: 0 0 0 6px var(--green-soft); }
    .status-dot.lost { background: var(--muted); box-shadow: 0 0 0 6px #edf0f4; }
    .status-copy strong { display: block; }
    .status-copy span { display: block; color: var(--muted); font-size: 13px; }
    .countdown { text-align: right; }
    .countdown strong { display: block; font: 800 25px/1 Consolas, monospace; }
    .countdown span { color: var(--muted); font-size: 12px; }
    .timeline { padding: 24px 28px; }
    .timeline-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 17px; }
    .timeline-title strong { font-size: 14px; }
    .timeline-title span { color: var(--muted); font-size: 12px; }
    .rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .rail-item { min-height: 80px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; }
    .rail-item.sent { border-color: #acd8cb; background: var(--green-soft); }
    .rail-item.pending { border-color: #edc178; background: var(--amber-soft); }
    .rail-item.failed { border-color: #efb3ab; background: var(--signal-soft); }
    .rail-item b { display: block; font-size: 13px; }
    .rail-item small { color: var(--muted); }
    .action-zone { padding: 0 28px 28px; }
    .confirm-button { width: 100%; border: 0; border-radius: 13px; padding: 16px 20px; color: white; background: var(--signal); font-weight: 800; cursor: pointer; box-shadow: 0 9px 22px rgba(199, 39, 26, .23); transition: transform .16s ease, box-shadow .16s ease; }
    .confirm-button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(199, 39, 26, .29); }
    .confirm-button:disabled { cursor: wait; opacity: .62; transform: none; }
    .helper { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: 12px; }
    .login { max-width: 430px; margin: 9vh auto 0; padding: 30px; }
    .login h1 { margin-bottom: 8px; }
    .login p { color: var(--muted); margin: 0 0 24px; }
    .field { display: flex; gap: 9px; }
    .field input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 13px 14px; background: #fff; }
    .field button, .subtle-button { border: 0; border-radius: 11px; padding: 12px 18px; color: white; background: var(--ink); cursor: pointer; font-weight: 700; }
    .error { color: var(--signal); margin-top: 12px; font-size: 13px; }
    .history-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 18px; }
    .history-head h1 { font-size: 34px; }
    .history-tools { display: flex; align-items: center; gap: 8px; }
    .filter-summary { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .filter-clear { border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; background: #fff; color: var(--ink); cursor: pointer; font-weight: 700; }
    .history-list { display: grid; gap: 11px; }
    .history-item { padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    .history-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .history-item h2 { margin: 3px 0 7px; font-size: 18px; line-height: 1.3; }
    .history-item p { margin: 0; color: var(--muted); }
    .history-actions { display: flex; gap: 8px; margin-top: 14px; }
    .history-action { border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; background: #fff; color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 700; }
    .history-action.confirm { color: var(--green); border-color: #acd8cb; background: var(--green-soft); }
    .history-action.delete { color: var(--signal); border-color: #efb3ab; background: var(--signal-soft); }
    .history-action:disabled { opacity: .5; cursor: wait; }
    .history-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 12px; }
    .filter-tag { border: 0; border-radius: 999px; padding: 5px 10px; color: var(--blue); background: #edf4ff; cursor: pointer; font-size: 12px; font-weight: 750; }
    .filter-tag.time { color: var(--amber); background: var(--amber-soft); }
    .filter-tag:hover { box-shadow: inset 0 0 0 1px currentColor; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 800; white-space: nowrap; background: #edf0f4; }
    .badge.level-1 { color: var(--signal); background: var(--signal-soft); }
    .badge.level-2 { color: var(--amber); background: var(--amber-soft); }
    .badge.level-3 { color: var(--blue); background: #edf4ff; }
    .meta { color: var(--muted); font: 11px Consolas, monospace; }
    .empty { padding: 60px 24px; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(199,39,26,.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (max-width: 620px) {
      .shell { width: min(100% - 20px, 920px); padding-top: 18px; }
      .clock { display: none; }
      .panel-head, .timeline, .action-zone { padding-left: 19px; padding-right: 19px; }
      .status-strip { grid-template-columns: 1fr; padding: 17px 19px; }
      .countdown { text-align: left; margin-left: 23px; }
      .rail { grid-template-columns: 1fr; }
      .history-head { align-items: start; }
      .history-head { flex-wrap: wrap; }
      .history-item { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <button class="brand" id="allNotifications" type="button" aria-label="查看全部通知"><span class="beacon" aria-hidden="true"></span><span><strong>通知中枢</strong><small>点击查看全部通知</small></span></button>
      <time class="clock" id="clock"></time>
    </header>

    <section id="loading" class="panel empty">正在读取通知状态…</section>

    <section id="notice" class="panel hidden" aria-live="polite">
      <div class="panel-head">
        <p class="eyebrow" id="noticeLevel"></p>
        <h1 id="noticeTitle"></h1>
        <p class="notice-body" id="noticeBody"></p>
      </div>
      <div class="status-strip">
        <div class="status-main"><span class="status-dot" id="statusDot"></span><div class="status-copy"><strong id="statusName"></strong><span id="statusDetail"></span></div></div>
        <div class="countdown"><strong id="countdown">--:--</strong><span>确认窗口剩余</span></div>
      </div>
      <div class="timeline">
        <div class="timeline-title"><strong>通知路径</strong><span id="nextReminder"></span></div>
        <div class="rail" id="rail"></div>
      </div>
      <div class="action-zone" id="actionZone">
        <button class="confirm-button" id="confirmButton">确认收到，停止提醒</button>
        <p class="helper">打开页面不会自动确认，只有点击按钮才会停止后续通知。</p>
      </div>
    </section>

    <section id="login" class="panel login hidden">
      <p class="eyebrow">Protected history</p>
      <h1>通知记录</h1>
      <p>输入管理口令查看全部发送与确认状态。</p>
      <form class="field" id="loginForm"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="管理口令" aria-label="管理口令"><button>进入</button></form>
      <div class="error" id="loginError"></div>
    </section>

    <section id="history" class="hidden">
      <div class="history-head"><div><p class="eyebrow">Delivery archive</p><h1 id="historyTitle">通知记录</h1><p class="filter-summary hidden" id="filterSummary"></p></div><div class="history-tools"><button class="filter-clear hidden" id="clearFilter">查看全部</button><button class="subtle-button" id="logout">退出</button></div></div>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <script>
    const API = location.hostname === 'localhost' || location.hostname.startsWith('127.') || location.hostname === '::1' || location.hostname === '[::1]' ? 'http://127.0.0.1:3219' : 'https://liangzai666.com/notify/api';
    const query = new URLSearchParams(location.search);
    const confirmationToken = query.get('token');
    let currentEvent = null;
    let countdownTimer = null;
    let allEvents = [];
    let activeFilter = null;
    const $ = (id) => document.getElementById(id);
    const labels = { open: '等待确认', confirmed: '已确认收到', lost: '通知遗失', informational: '无需确认' };
    const channelLabels = { wecom: '企业微信', email: '邮件', serverchan: 'Server酱' };
    const statusLabels = { sent: '已发送', pending: '待发送', sending: '发送中', failed: '发送失败', cancelled: '已停止' };

    function show(id) { ['loading','notice','login','history'].forEach((name) => $(name).classList.toggle('hidden', name !== id)); }
    function formatTime(value) { return value ? new Intl.DateTimeFormat('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).format(new Date(value)) : '—'; }
    function timeCategory(value) {
      const date = new Date(value); const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const eventDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const days = Math.round((start - eventDay) / 86400000);
      return days <= 0 ? '今天' : days === 1 ? '昨天' : days === 2 ? '两天前' : days <= 7 ? '近一周' : '更早';
    }
    function updateClock() { $('clock').textContent = new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).format(new Date()); }
    setInterval(updateClock, 1000); updateClock();

    async function api(path, options = {}) {
      const response = await fetch(API + path, { ...options, headers: { 'content-type':'application/json', ...options.headers } });
      const data = await response.json().catch(() => ({ error:{ code:'INVALID_RESPONSE' } }));
      if (!response.ok) throw Object.assign(new Error(data.error?.code || 'REQUEST_FAILED'), { status: response.status, data });
      return data;
    }

    function renderNotice(event) {
      currentEvent = event;
      show('notice');
      $('noticeLevel').textContent = `LEVEL ${event.level} · ${event.source}`;
      $('noticeTitle').textContent = event.title;
      $('noticeBody').textContent = event.body;
      $('statusName').textContent = labels[event.status] || event.status;
      $('statusDot').className = `status-dot ${event.status}`;
      $('statusDetail').textContent = event.status === 'open' ? `创建于 ${formatTime(event.createdAt)}` : event.status === 'confirmed' ? `确认于 ${formatTime(event.confirmedAt)}` : `截止于 ${formatTime(event.expiresAt)}`;
      $('nextReminder').textContent = event.status === 'open' && event.nextReminderAt ? `下次 ${formatTime(event.nextReminderAt)}` : '提醒已停止';
      $('actionZone').classList.toggle('hidden', event.status !== 'open');
      $('rail').innerHTML = summarizeDeliveries(event.deliveries || []).map((item) => `<div class="rail-item ${item.state}"><b>${channelLabels[item.channel]}</b><small>${statusLabels[item.state] || item.state}${item.sentAt ? ` · ${formatTime(item.sentAt)}` : ''}</small></div>`).join('');
      clearInterval(countdownTimer);
      const update = () => {
        if (event.status !== 'open') { $('countdown').textContent = '--:--'; return; }
        const left = Math.max(0, Date.parse(event.expiresAt) - Date.now());
        const minutes = Math.floor(left / 60000); const seconds = Math.floor((left % 60000) / 1000);
        $('countdown').textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
      };
      update(); countdownTimer = setInterval(update, 1000);
    }

    function summarizeDeliveries(deliveries) {
      return ['wecom','email','serverchan'].map((channel) => {
        const rows = deliveries.filter((item) => item.channel === channel);
        const sent = rows.filter((item) => item.status === 'sent').at(-1);
        const failed = rows.find((item) => item.status === 'failed');
        const pending = rows.find((item) => item.status === 'pending' || item.status === 'sending');
        return { channel, state: sent ? 'sent' : failed && !pending ? 'failed' : pending ? 'pending' : 'cancelled', sentAt: sent?.sentAt };
      });
    }

    async function loadConfirmation() {
      try { const data = await api(`/v1/public/event?token=${encodeURIComponent(confirmationToken)}`); renderNotice(data.event); }
      catch (error) { $('loading').textContent = error.status === 401 || error.status === 410 ? '确认链接已失效。' : '通知状态读取失败，请稍后重试。'; }
    }

    $('confirmButton').addEventListener('click', async () => {
      const button = $('confirmButton'); button.disabled = true; button.textContent = '正在确认…';
      try { const data = await api('/v1/public/confirm', { method:'POST', body:JSON.stringify({ token:confirmationToken }) }); renderNotice({ ...data.event, deliveries: currentEvent.deliveries }); }
      catch (error) { button.disabled = false; button.textContent = error.status === 410 ? '确认窗口已结束' : '确认失败，点击重试'; }
    });

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault(); $('loginError').textContent = '';
      try { const data = await api('/v1/session', { method:'POST', body:JSON.stringify({ pin:$('pin').value }) }); localStorage.setItem('notificationHubSession', data.token); await loadHistory(); }
      catch (error) { $('loginError').textContent = error.status === 429 ? '尝试次数过多，请15分钟后再试。' : '口令不正确。'; }
    });

    function renderHistory() {
      const events = activeFilter ? allEvents.filter((event) => activeFilter.type === 'source' ? event.source === activeFilter.value : timeCategory(event.createdAt) === activeFilter.value) : allEvents;
      $('historyTitle').textContent = activeFilter ? activeFilter.value : '通知记录';
      $('filterSummary').textContent = activeFilter ? `${activeFilter.type === 'source' ? '来源' : '时间'}分类 · ${events.length} 条通知` : '';
      $('filterSummary').classList.toggle('hidden', !activeFilter);
      $('clearFilter').classList.toggle('hidden', !activeFilter);
      $('historyList').innerHTML = events.length ? events.map((event) => `<article class="history-item" data-event-id="${escapeHtml(event.id)}"><div class="history-top"><span class="badge level-${event.level}">LEVEL ${event.level}</span><span class="meta">${formatTime(event.createdAt)}</span></div><h2>${escapeHtml(event.title)}</h2><p>${escapeHtml(event.body)}</p><div class="history-tags"><button class="filter-tag" data-filter="source" data-value="${encodeURIComponent(event.source)}">${escapeHtml(event.source)}</button><button class="filter-tag time" data-filter="time" data-value="${timeCategory(event.createdAt)}">${timeCategory(event.createdAt)}</button><span class="meta">${escapeHtml(event.eventKey)}</span></div><div class="history-top" style="margin-top:12px"><span></span><strong>${labels[event.status] || event.status}</strong></div><div class="history-actions">${event.status === 'open' ? '<button class="history-action confirm" data-action="confirm">确认并停止提醒</button>' : ''}<button class="history-action delete" data-action="delete">删除</button></div></article>`).join('') : '<div class="panel empty">这个分类还没有通知。</div>';
    }

    async function loadHistory(resetFilter = false) {
      const token = localStorage.getItem('notificationHubSession');
      if (!token) { show('login'); return; }
      try {
        const data = await api('/v1/events?limit=1000', { headers:{ authorization:`Bearer ${token}` } });
        allEvents = data.events;
        if (resetFilter) activeFilter = null;
        show('history');
        renderHistory();
      } catch { localStorage.removeItem('notificationHubSession'); show('login'); }
    }

    $('allNotifications').addEventListener('click', () => loadHistory(true));
    $('clearFilter').addEventListener('click', () => { activeFilter = null; renderHistory(); });
    $('historyList').addEventListener('click', async (click) => {
      const tag = click.target.closest('[data-filter]');
      if (tag) { activeFilter = { type: tag.dataset.filter, value: tag.dataset.filter === 'source' ? decodeURIComponent(tag.dataset.value) : tag.dataset.value }; renderHistory(); return; }
      const button = click.target.closest('[data-action]');
      if (!button) return;
      const item = button.closest('[data-event-id]');
      const token = localStorage.getItem('notificationHubSession');
      if (!item || !token) { show('login'); return; }
      button.disabled = true;
      try {
        const action = button.dataset.action;
        await api(`/v1/events/${encodeURIComponent(item.dataset.eventId)}${action === 'confirm' ? '/confirm' : ''}`, { method: action === 'confirm' ? 'POST' : 'DELETE', headers:{ authorization:`Bearer ${token}` } });
        await loadHistory();
      } catch (error) {
        button.disabled = false;
        button.textContent = error.status === 401 ? '请重新登录' : '操作失败，重试';
      }
    });

    $('logout').addEventListener('click', () => { localStorage.removeItem('notificationHubSession'); show('login'); });
    function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
    if (confirmationToken) loadConfirmation(); else loadHistory();
  </script>
</body>
</html>
